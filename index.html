<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre</title>
    <!-- Estilo oficial -->
    <link rel="stylesheet" href="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/style.css">
    <script>
        // COLE O SEU LINK DE AFILIADO AQUI DENTRO DAS ASPAS
        const SEU_LINK_AFILIADO = "https://www.mercadolivre.com.br/social/atelierdoslinks/lists";

        // Redireciona de forma garantida sem quebrar o site
        document.addEventListener('click', function(e) {
            const botaoOuLink = e.target.closest('a, button, .btn');
            if (botaoOuLink) {
                // Abre o seu link de afiliado em uma nova aba com 100% de segurança
                window.open(SEU_LINK_AFILIADO, '_blank');
            }
        });
    </script>
</head>
<body>
    <div id="app"></div>
    
    <!-- Script que carrega os cupons do Mercado Livre em tempo real -->
    <script src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/script.js"></script>
</body>
</html>
