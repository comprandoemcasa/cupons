<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <!-- Estilo Oficial dos Cupons -->
    <link rel="stylesheet" href="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/style.css">
    <style>
        /* Esconde o botão 'Ganhos Extras' e links indesejados */
        a[href*="ganhosextras"], 
        a[href*="telegram"], 
        .top-bar-extra,
        header .flex > a:last-child { 
            display: none !important; 
        }

        /* Sua barra fixa no topo */
        .minha-barra {
            background-color: #ffe600;
            color: #2d3277;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .minha-barra a {
            background: #2d3277;
            color: #fff;
            padding: 5px 12px;
            border-radius: 15px;
            text-decoration: none;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="minha-barra">
        🔥 Cupons e Listas Oficiais do Mercado Livre!
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">VER MINHAS VITRINES 🛍️</a>
    </div>

    <div id="app"></div>

    <script>
        // SEU LINK BASE DE AFILIADO / USERNAME
        const MINHA_PAGINA_GERAL = "https://www.mercadolivre.com.br/social/atelierdoslinks/lists";

        // Intercepta todos os cliques com segurança
        window.addEventListener('click', function(e) {
            const elemento = e.target.closest('a, button, .btn');
            
            if (elemento) {
                // Permite usar os filtros de categoria e a barra de busca
                const eFiltro = elemento.closest('.filters, .category-filter, nav') || 
                                elemento.tagName === 'INPUT' || 
                                elemento.classList.contains('filter-btn');

                if (eFiltro) return;

                // Captura a URL do botão original
                let urlOriginal = elemento.getAttribute('href') || elemento.dataset.url || '';

                // Se for um botão de ver lista ou de cupom
                if (urlOriginal.includes('mercadolivre.com') || elemento.innerText.toLowerCase().includes('lista') || elemento.innerText.toLowerCase().includes('ver')) {
                    e.preventDefault();
                    e.stopPropagation();

                    try {
                        if (urlOriginal.startsWith('http')) {
                            // Injeta os parâmetros de comissão na URL exata da lista
                            const urlObj = new URL(urlOriginal);
                            urlObj.searchParams.set('pennid', 'atelierdoslinks');
                            urlObj.searchParams.set('matt_tool', '18442875');
                            window.open(urlObj.toString(), '_blank');
                        } else {
                            window.open(MINHA_PAGINA_GERAL, '_blank');
                        }
                    } catch (err) {
                        // Fallback de segurança se a URL for inválida
                        window.open(MINHA_PAGINA_GERAL, '_blank');
                    }
                }
            }
        }, true);

        // Busca de dados dos cupons via proxy seguro
        const fetchOriginal = window.fetch;
        window.fetch = function(url, options) {
            if (typeof url === 'string' && (url.endsWith('.json') || !url.startsWith('http'))) {
                url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/' + url.replace(/^\//, ''));
            }
            return fetchOriginal(url, options);
        };
    </script>

    <script src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/script.js"></script>
</body>
</html>
