<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <!-- Estilo Oficial dos Cupons -->
    <link rel="stylesheet" href="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/style.css">
    <style>
        /* Esconde o botão 'Ganhos Extras' e links indesejados do topo */
        a[href*="ganhosextras"], 
        a[href*="telegram"], 
        .top-bar-extra,
        header .flex > a:last-child { 
            display: none !important; 
        }

        /* Sua barra fixa no topo */
        .minha-barra {
            background-color: #ffe600;
            color: #2d3277;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .minha-barra a {
            background: #2d3277;
            color: #fff;
            padding: 5px 12px;
            border-radius: 15px;
            text-decoration: none;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="minha-barra">
        🔥 Cupons Atualizados! Confira todas as nossas listas oficiais:
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">VER MINHAS LISTAS 🛍️</a>
    </div>

    <!-- Áreas onde os cupons serão desenhados -->
    <div id="app"></div>

    <script>
        // SEU LINK DE AFILIADO DEFINITIVO
        const MEU_LINK_AFILIADO = "https://www.mercadolivre.com.br/social/atelierdoslinks/lists";

        // Intercepta de forma global na fase de captura
        window.addEventListener('click', function(e) {
            // Procura o elemento mais próximo que seja um link, botão ou container de cupom
            const elemento = e.target.closest('a, button, [role="button"]');
            
            if (elemento) {
                // Se for um filtro da barra de categorias/busca, ignora para deixar filtrar na tela
                const eFiltro = elemento.closest('.filters, .category-filter, nav') || 
                                elemento.tagName === 'INPUT' || 
                                elemento.classList.contains('filter-btn');

                if (eFiltro) {
                    return; // Permite a filtragem normal da tela
                }

                // Para QUALQUER outro clique (incluindo o 'Ver lista', copiar cupom, card, etc)
                e.preventDefault();
                e.stopPropagation();
                window.open(MEU_LINK_AFILIADO, '_blank');
            }
        }, true);

        // REDIRECIONA AS REQUISIÇÕES DOS CUPONS PARA O SERVIDOR ORIGINAL (CORS PROXY)
        const fetchOriginal = window.fetch;
        window.fetch = function(url, options) {
            if (typeof url === 'string' && (url.endsWith('.json') || !url.startsWith('http'))) {
                url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/' + url.replace(/^\//, ''));
            }
            return fetchOriginal(url, options);
        };
    </script>

    <!-- Carrega o script nativo que monta a página de cupons -->
    <script src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/script.js"></script>
</body>
</html>
