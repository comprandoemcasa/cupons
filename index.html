<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Atualizados</title>
    <!-- CSS Original para manter o visual exato -->
    <link rel="stylesheet" href="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/style.css">
    <style>
        body { background-color: #f5f5f5; margin: 0; padding: 0; }
        .afiliado-bar {
            background: #ffe600;
            color: #2d3277;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="afiliado-bar">
        ⚡ Cupons atualizados do Mercado Livre — Clique em qualquer cupom para garantir o desconto!
    </div>

    <!-- Div principal do aplicativo -->
    <div id="app"></div>

    <script>
        // 1. COLOQUE O SEU LINK DE AFILIADO AQUI
        const MEU_LINK_AFILIADO = "https://www.mercadolivre.com.br/social/atelierdoslinks/lists";

        // Intercepta todos os cliques na página para redirecionar de forma segura
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a, button, .card-cupom');
            if (target) {
                // Abre o seu link de afiliado do Mercado Livre
                window.open(MEU_LINK_AFILIADO, '_blank');
            }
        }, true);
    </script>

    <!-- Puxa os scripts em modo CORS liberado para carregar a lista normalmente -->
    <script crossorigin="anonymous" src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/script.js"></script>
</body>
</html>
