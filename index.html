<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #0d0068;
        }
        
        /* Barra Fixa de Alerta e Comissão no Topo */
        .banner-afiliado {
            background-color: #ffe600;
            color: #2d3277;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.3);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
        }
        .banner-afiliado a {
            background-color: #2d3277;
            color: #ffffff;
            padding: 6px 14px;
            margin-left: 8px;
            text-decoration: none;
            border-radius: 20px;
            display: inline-block;
            transition: 0.3s;
        }

        /* Container ajustado para rolagem perfeita e corte da barra indesejada */
        .iframe-container {
            margin-top: 45px;
            width: 100%;
            height: calc(100vh - 45px);
            overflow: hidden;
            position: relative;
        }

        /* Iframe ajustado para rolar de ponta a ponta e sem o botão Ganhos Extras */
        iframe {
            width: 100%;
            height: calc(100% + 55px);
            border: none;
            margin-top: -55px; /* Esconde o topo com "Ganhos Extras" */
        }
    </style>
</head>
<body>

    <!-- Sua barra fixada com o seu link principal -->
    <div class="banner-afiliado">
        🔥 Pegue o cupom abaixo e navegue pelas nossas listas oficiais! 
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">MINHAS LISTAS ML 🛍️</a>
    </div>

    <div class="iframe-container">
        <!-- O iframe agora roda com interatividade TOTAL e rolagem liberada -->
        <iframe id="siteCupons" src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/"></iframe>
    </div>

</body>
</html>
