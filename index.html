<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background-color: #0d0068;
        }
        
        /* 1. Sua barra amarela no topo */
        .banner-afiliado {
            background-color: #ffe600;
            color: #2d3277;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        .banner-afiliado a {
            background-color: #2d3277;
            color: #ffffff;
            padding: 6px 14px;
            margin-left: 10px;
            text-decoration: none;
            border-radius: 20px;
            display: inline-block;
            transition: 0.3s;
        }

        /* 2. Conteúdo e Máscara dos Cupons */
        .iframe-container {
            position: relative;
            margin-top: 45px; /* Espaço da sua barra amarela */
            height: calc(100vh - 45px);
            overflow: hidden;
        }

        /* Esconde a barra amarela original do script (onde ficava "Ganhos Extras") */
        iframe {
            width: 100%;
            height: calc(100% + 55px);
            border: none;
            margin-top: -55px; /* Sobe o iframe para esconder a barra de cima! */
        }

        /* 3. CAMADA TRANSPARENTE DA COMISSÃO: Intercepta QUALQUER clique na página */
        .clique-comissao {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sua barra de topo -->
    <div class="banner-afiliado">
        🔥 Pegue seu cupom e confira todas as nossas listas completas! 
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">VER LISTAS COM CUPOM 🛍️</a>
    </div>

    <div class="iframe-container">
        <!-- Camada transparente: Qualquer lugar que o cliente clicar no site, abre a SUA lista de afiliado! -->
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank" class="clique-comissao" title="Clique para ver cupons e listas"></a>

        <!-- Página de cupons oficial escondendo o menu "Ganhos Extras" -->
        <iframe src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/"></iframe>
    </div>

</body>
</html>
