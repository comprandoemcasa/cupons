<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre</title>
    <!-- Carrega o CSS original -->
    <link rel="stylesheet" href="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/style.css">
</head>
<body>
    <div id="app"></div>

    <script>
        // 1. SEU LINK DE AFILIADO AQUI
        const MEU_LINK_AFILIADO = "https://www.mercadolivre.com.br/social/atelierdoslinks/lists";

        // 2. Intercepta os cliques para mandar pro seu link de afiliado
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a, button');
            if (target) {
                // Impede a navegação padrão e abre seu link de afiliado
                e.preventDefault();
                window.open(MEU_LINK_AFILIADO, '_blank');
            }
        }, true);

        // 3. Modifica a busca de dados para apontar diretamente para o servidor original
        const originalFetch = window.fetch;
        window.fetch = function() {
            let url = arguments[0];
            if (typeof url === 'string' && !url.startsWith('http')) {
                // Se o script tentar buscar um arquivo local, redireciona para o GitHub do Mercado Livre
                arguments[0] = 'https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/' + url.replace(/^\//, '');
            }
            return originalFetch.apply(this, arguments);
        };
    </script>

    <!-- Carrega o script oficial de cupons -->
    <script src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/script.js"></script>
</body>
</html>
