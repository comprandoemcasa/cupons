<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* 1. Sua barra oficial de comissão no topo */
        .minha-barra {
            background-color: #ffe600;
            color: #2d3277;
            padding: 10px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            z-index: 99999;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .minha-barra a {
            background: #2d3277;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }
        .minha-barra a:hover {
            background: #1d2150;
        }

        /* 2. Container ajustado para cortar o "Ganhos Extras" */
        .iframe-wrapper {
            position: absolute;
            top: 45px; /* Altura da sua barra */
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
            overflow: hidden;
        }

        /* 3. Iframe com deslocamento negativo para esconder a barra amarela original */
        iframe {
            width: 100%;
            height: calc(100% + 52px);
            border: none;
            margin-top: -52px; /* Esconde perfeitamente o botão Ganhos Extras */
        }
    </style>
</head>
<body>

    <!-- Sua Barra Fixa de Afiliado -->
    <div class="minha-barra">
        <span>🔥 Cupons e Vitrines Oficiais Mercado Livre</span>
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">VER MINHAS LISTAS 🛍️</a>
    </div>

    <!-- Container dos Cupons -->
    <div class="iframe-wrapper">
        <iframe src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/"></iframe>
    </div>

</body>
</html>
