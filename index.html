<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* 1. Sua barra fixa oficial no topo */
        .minha-barra {
            background-color: #ffe600;
            color: #2d3277;
            padding: 10px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            z-index: 99999;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .minha-barra a {
            background: #2d3277;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        /* 2. Wrapper que corta o 'Ganhos Extras' */
        .iframe-wrapper {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            height: calc(100% - 45px);
            overflow: hidden;
        }

        /* 3. Iframe com a página de cupons */
        iframe {
            width: 100%;
            height: calc(100% + 52px);
            border: none;
            margin-top: -52px;
        }
    </style>
</head>
<body>

    <!-- Sua Barra Fixa -->
    <div class="minha-barra">
        <span>🔥 Cupons e Vitrines Oficiais Mercado Livre</span>
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">VER MINHAS LISTAS 🛍️</a>
    </div>

    <!-- Container dos Cupons -->
    <div class="iframe-wrapper" id="containerCupons">
        <iframe id="meuIframe" src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/"></iframe>
    </div>

    <script>
        // SEU LINK DE AFILIADO PRINCIPAL
        const MEU_LINK_AFILIADO = "https://www.mercadolivre.com.br/social/atelierdoslinks/lists";

        // Sempre que o usuário clica dentro da área do iframe, ele perde o foco da página atual.
        // Capturamos essa perda de foco e abrimos seu link de afiliado para garantir a comissão!
        let monitorFoco = setInterval(function() {
            if (document.activeElement === document.getElementById('meuIframe')) {
                // Abre a sua vitrine de afiliado para ativar o cookie de 24h
                window.open(MEU_LINK_AFILIADO, '_blank');
                // Devolve o foco para o site
                window.focus();
            }
        }, 500);
    </script>

</body>
</html>
