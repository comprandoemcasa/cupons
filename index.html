<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupons Mercado Livre | Comprando em Casa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* Barra de destaque do seu Link de Afiliado */
        .banner-afiliado {
            background-color: #ffe600;
            color: #2d3277;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }
        .banner-afiliado a {
            background-color: #2d3277;
            color: #ffffff;
            padding: 6px 14px;
            margin-left: 10px;
            text-decoration: none;
            border-radius: 20px;
            display: inline-block;
            transition: 0.3s;
        }
        .banner-afiliado a:hover {
            background-color: #1e2152;
        }
        /* Iframe que carrega a lista oficial de cupons */
        iframe {
            width: 100%;
            height: calc(100vh - 45px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- Barra do seu Afiliado -->
    <div class="banner-afiliado">
        🔥 Pegue seu cupom abaixo e acesse nossas listas de ofertas! 
        <a href="https://www.mercadolivre.com.br/social/atelierdoslinks/lists" target="_blank">VER MINHAS LISTAS ML 🛍️</a>
    </div>

    <!-- Página oficial de cupons (Atualiza sozinha) -->
    <iframe src="https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/"></iframe>

</body>
</html>
