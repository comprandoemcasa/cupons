name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair Cupons
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Obtendo dados do site de origem...");
              const res = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
              });

              const html = res.data;
              const cuponsMap = new Map();

              // Varre por códigos de cupons e descontos
              const regex = /"([A-Z0-9]{4,20})"/g;
              const matches = html.match(regex) || [];

              const palavrasBloqueadas = [
                "NEXT", "DATA", "BUILD", "PAGE", "PROPS", "STATIC", "RUNTIME", "CHUNK", 
                "MANIFEST", "UTF8", "REACT", "HEAD", "BODY", "META", "LINK", "TRUE", 
                "FALSE", "NULL", "UNDEFINED", "SPAN", "DIV", "STYLE", "SCRIPT", "CLASS", 
                "HREF", "PATH", "TYPE", "SLUG", "MAIN", "INDEX", "HOME", "VIEW", "APP"
              ];

              matches.forEach(m => {
                const code = m.replace(/"/g, "").trim();
                if (
                  code.length >= 4 && 
                  !palavrasBloqueadas.includes(code) && 
                  isNaN(code) && 
                  /[A-Z]/.test(code) &&
                  !cuponsMap.has(code)
                ) {
                  cuponsMap.set(code, {
                    code: code,
                    discount: "Cupom Oficial ML",
                    category: "Mercado Livre",
                    min_purchase: ""
                  });
                }
              });

              const listaFinal = Array.from(cuponsMap.values());
              console.log("Total de cupons válidos capturados:", listaFinal.length);

              fs.writeFileSync("data.json", JSON.stringify(listaFinal, null, 2));
            } catch (err) {
              console.error("Erro:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons atualizados sem duplicações [skip ci]" || exit 0
          git push
