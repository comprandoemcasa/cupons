name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada hora
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios cheerio

      - name: Raspar cupons reais do site oficial
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              const res = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/index.html");
              const html = res.data;
              let cupons = [];

              // Procura o trecho de script onde o JSON original dos cupons fica armazenado
              const match = html.match(/const\s+cuponsData\s*=\s*(\[[\s\S]*?\]);/);
              if (match && match[1]) {
                cupons = JSON.parse(match[1]);
              } else {
                // Busca alternativa em caso de formato variado
                const matchAlt = html.match(/\[\s*\{\s*"code"[\s\S]*?\}\s*\]/);
                if (matchAlt) {
                  cupons = JSON.parse(matchAlt[0]);
                }
              }

              fs.writeFileSync("data.json", JSON.stringify(cupons, null, 2));
              console.log("Salvo " + cupons.length + " cupons reais com sucesso!");
            } catch (err) {
              console.error("Erro ao extrair:", err);
              process.exit(1);
            }
          }
          extrair();
          '

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Atualizando cupons reais [skip ci]" || exit 0
          git push
