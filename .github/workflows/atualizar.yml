name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair Cupons e Regras Completas
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Baixando HTML da página fonte...");
              const response = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
                }
              });

              const html = response.data;
              const cupons = [];

              // Extrai o bloco de dados do Next.js
              const match = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);

              if (match && match[1]) {
                const parsed = JSON.parse(match[1]);
                
                // Mapeia recursivamente para encontrar a lista de cupons
                function buscarLista(obj) {
                  if (!obj || typeof obj !== "object") return;

                  if (Array.isArray(obj)) {
                    obj.forEach(item => {
                      if (item && typeof item === "object" && (item.code || item.codigo)) {
                        const code = (item.code || item.codigo || "").toString().trim();
                        if (code && code.length >= 3) {
                          cupons.push({
                            code: code,
                            discount: item.discount || item.desconto || item.discountValue || "Desconto Especial",
                            category: item.category || item.categoria || item.tag || "Mercado Livre",
                            min_purchase: item.minPurchase || item.min_purchase || item.minimo || "",
                            max_discount: item.maxDiscount || item.max_discount || item.maximo || ""
                          });
                        }
                      } else {
                        buscarLista(item);
                      }
                    });
                  } else {
                    for (let key in obj) {
                      if (typeof obj[key] === "object") {
                        buscarLista(obj[key]);
                      }
                    }
                  }
                }

                buscarLista(parsed);
              }

              // Remove duplicados pelo código
              const cuponsUnicos = [];
              const codigosVistos = new Set();

              for (const c of cupons) {
                const codeUpper = c.code.toUpperCase();
                if (!codigosVistos.has(codeUpper)) {
                  codigosVistos.add(codeUpper);
                  cuponsUnicos.push(c);
                }
              }

              console.log("Cupons extraídos com sucesso:", cuponsUnicos.length);

              if (cuponsUnicos.length > 0) {
                fs.writeFileSync("data.json", JSON.stringify(cuponsUnicos, null, 2));
              }

            } catch (err) {
              console.error("Erro na extração:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "data.json atualizado com regras exatas [skip ci]" || exit 0
          git push
