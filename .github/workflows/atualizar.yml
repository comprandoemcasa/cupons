name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair Cupons e Regras Completas
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Lendo dados detalhados da página...");
              const response = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
              });

              const html = response.data;
              const cuponsMap = new Map();

              const match = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);

              if (match && match[1]) {
                const dataObj = JSON.parse(match[1]);

                function buscarCuponsRicos(obj) {
                  if (!obj || typeof obj !== "object") return;

                  // Procura estruturas de cupons no JSON
                  const codigo = obj.code || obj.codigo || obj.couponCode || obj.coupon;
                  
                  if (codigo && typeof codigo === "string") {
                    const codeUpper = codigo.trim().toUpperCase();
                    const palavrasInvalidas = ["DESCONTO", "CUPOM", "CUPONS", "MERCADO", "LIVRE", "MAISCUPONS"];

                    if (
                      codeUpper.length >= 4 &&
                      !codeUpper.startsWith("MLB") &&
                      !palavrasInvalidas.includes(codeUpper) &&
                      isNaN(codeUpper)
                    ) {
                      // Extrai regras reais do cupom
                      let desconto = obj.discount || obj.desconto || obj.value || obj.amount || "";
                      let categoria = obj.category || obj.categoria || obj.tag || "Mercado Livre";
                      let minimo = obj.min_purchase || obj.minimo || obj.minPurchase || obj.min || "";
                      let maximo = obj.max_discount || obj.maximo || obj.maxDiscount || "";

                      // Formata porcentagem/valor de desconto caso seja número puro
                      if (desconto && !isNaN(desconto)) {
                        desconto = desconto <= 100 ? `${desconto}% OFF` : `R$ ${desconto} OFF`;
                      } else if (!desconto) {
                        desconto = "Desconto Especial";
                      }

                      cuponsMap.set(codeUpper, {
                        code: codeUpper,
                        discount: desconto,
                        category: categoria,
                        min_purchase: minimo ? String(minimo) : "",
                        max_discount: maximo ? String(maximo) : ""
                      });
                    }
                  }

                  for (let key in obj) {
                    if (typeof obj[key] === "object") {
                      buscarCuponsRicos(obj[key]);
                    }
                  }
                }

                buscarCuponsRicos(dataObj);
              }

              const listaFinal = Array.from(cuponsMap.values());
              console.log("Total de cupons com regras capturados:", listaFinal.length);

              if (listaFinal.length > 0) {
                fs.writeFileSync("data.json", JSON.stringify(listaFinal, null, 2));
              } else {
                console.log("Nenhum cupom extraído, mantendo data.json anterior.");
              }

            } catch (err) {
              console.error("Erro ao extrair:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons com regras completas atualizados [skip ci]" || exit 0
          git push
