name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios cheerio

      - name: Extrair Cupons com Dados Reais
        run: |
          node -e '
          const axios = require("axios");
          const cheerio = require("cheerio");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Acessando a página...");
              const { data: html } = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
              });

              const $ = cheerio.load(html);
              const cupons = [];

              // Método 1: Extrair via JSON do NextJS se presente
              const nextDataMatch = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);
              
              if (nextDataMatch && nextDataMatch[1]) {
                try {
                  const json = JSON.parse(nextDataMatch[1]);
                  
                  function encontrarObjetosCupons(obj) {
                    if (!obj || typeof obj !== "object") return;
                    
                    if (Array.isArray(obj)) {
                      obj.forEach(item => encontrarObjetosCupons(item));
                      return;
                    }

                    // Identifica se é uma estrutura de cupom
                    const code = obj.code || obj.coupon || obj.codigo;
                    if (code && typeof code === "string" && code.length >= 3) {
                      
                      let desc = "";
                      if (obj.discount) desc = String(obj.discount);
                      else if (obj.discountValue) {
                        desc = (obj.discountType === "percentage" || String(obj.discountValue).includes("%")) 
                          ? `${obj.discountValue}%` 
                          : `R$${obj.discountValue}`;
                      } else if (obj.value) desc = String(obj.value);

                      if (desc && !desc.includes("OFF")) desc += " OFF";

                      let min = obj.minPurchase || obj.min_purchase || obj.compraMinima || obj.min || "";
                      if (min && !String(min).includes("R$")) min = `R$ ${min}`;

                      let max = obj.maxDiscount || obj.max_discount || obj.descontoMaximo || obj.max || "";
                      if (max && !String(max).includes("R$")) max = `R$ ${max}`;

                      cupons.push({
                        code: code.trim().toUpperCase(),
                        discount: desc || "Desconto",
                        category: obj.category || obj.categoria || "OUTROS",
                        min_purchase: min || "Sem Mínimo",
                        max_discount: max || "Sem limite"
                      });
                    }

                    for (let k in obj) {
                      if (typeof obj[k] === "object") encontrarObjetosCupons(obj[k]);
                    }
                  }

                  encontrarObjetosCupons(json);
                } catch (e) {
                  console.log("Aviso ao parsear JSON:", e.message);
                }
              }

              // Método 2: Scraping regex no HTML bruto para capturar blocos visuais reais
              // Procura padrões de código de cupom acompanhados por suas regras
              const regexBloco = /([A-Z0-9_-]{4,25})[\s\S]*?((\d+%\s*OFF|\d+%\s*|R\$\s*\d+[\s\S]*?OFF))[\s\S]*?COMPRA MÍNIMA[\s\S]*?(R\$\s*\d+|\d+)[\s\S]*?DESCONTO MÁX\.?[\s\S]*?(R\$\s*\d+|\d+)/gi;

              let m;
              while ((m = regexBloco.exec(html)) !== null) {
                const code = m[1].toUpperCase();
                // Evita palavras reservadas
                if (!["COMPRA", "DESCONTO", "PERIODO", "COPIAR", "OUTROS", "MERCADO"].includes(code)) {
                  let desc = m[2].replace(/\s+/g, ' ').trim();
                  if (!desc.includes("OFF")) desc += " OFF";

                  let min = m[4].trim();
                  if (!min.startsWith("R$")) min = "R$ " + min;

                  let max = m[5].trim();
                  if (!max.startsWith("R$")) max = "R$ " + max;

                  cupons.push({
                    code: code,
                    discount: desc,
                    category: "OUTROS",
                    min_purchase: min,
                    max_discount: max
                  });
                }
              }

              // Limpeza e deduplicação mantendo as informações mais completas
              const mapa = new Map();
              for (const c of cupons) {
                if (!mapa.has(c.code)) {
                  mapa.set(c.code, c);
                } else {
                  const existente = mapa.get(c.code);
                  if (existente.discount === "Desconto" || existente.min_purchase === "Sem Mínimo") {
                    mapa.set(c.code, c);
                  }
                }
              }

              const resultado = Array.from(mapa.values());
              console.log("Cupons capturados com sucesso:", resultado);

              if (resultado.length > 0) {
                fs.writeFileSync("data.json", JSON.stringify(resultado, null, 2));
              } else {
                console.log("Nenhum cupom novo encontrado, mantendo anterior.");
              }

            } catch (err) {
              console.error("Erro na extração:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons atualizados com valores dinâmicos [skip ci]" || exit 0
          git push
