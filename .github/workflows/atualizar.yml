name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair Cupons com Regras
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Baixando fonte...");
              const response = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                }
              });

              const html = response.data;
              const cupons = [];

              // Procura por todos os objetos dentro da lista de cupons
              const regexCoupons = /\{[^{}]*"code"\s*:\s*"([^"]+)"[^{}]*\}/g;
              
              // Busca ampla por JSONs estruturados na página
              const jsonMatches = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);

              if (jsonMatches && jsonMatches[1]) {
                const data = JSON.parse(jsonMatches[1]);
                
                function varrerObj(obj) {
                  if (!obj || typeof obj !== "object") return;

                  if (obj.code && (obj.discountValue || obj.discount || obj.minPurchase || obj.category)) {
                    let descFormatado = "";
                    if (obj.discountValue) {
                      descFormatado = obj.discountType === "percentage" || obj.discountType === "%" 
                        ? `${obj.discountValue}% OFF` 
                        : `R$ ${obj.discountValue} OFF`;
                    } else if (obj.discount) {
                      descFormatado = obj.discount;
                    } else {
                      descFormatado = "Desconto Especial";
                    }

                    cupons.push({
                      code: String(obj.code).trim().toUpperCase(),
                      discount: descFormatado,
                      category: obj.category || obj.categoria || "Mercado Livre",
                      min_purchase: obj.minPurchase || obj.min_purchase || obj.minimo || "",
                      max_discount: obj.maxDiscount || obj.max_discount || "",
                      period: obj.period || obj.expirationDate || ""
                    });
                  }

                  for (let key in obj) {
                    if (typeof obj[key] === "object") {
                      varrerObj(obj[key]);
                    }
                  }
                }

                varrerObj(data);
              }

              // Garante remoção de duplicados
              const mapa = new Map();
              for (const c of cupons) {
                if (!mapa.has(c.code)) {
                  mapa.set(c.code, c);
                }
              }

              const resultado = Array.from(mapa.values());
              console.log("Cupons capturados com regras:", resultado.length);

              if (resultado.length > 0) {
                fs.writeFileSync("data.json", JSON.stringify(resultado, null, 2));
              }

            } catch (err) {
              console.error("Erro ao extrair:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons com regras atualizadas [skip ci]" || exit 0
          git push
