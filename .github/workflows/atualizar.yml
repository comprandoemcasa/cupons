name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair lista de cupons
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              const res = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/index.html");
              const html = res.data;
              let cuponsEncontrados = [];

              // Encontra todas as estruturas JSON [ { ... } ] dentro do código-fonte da página
              const jsonMatches = html.match(/\[\s*\{[\s\S]*?\}\s*\]/g) || [];
              
              for (const matchStr of jsonMatches) {
                try {
                  const parsed = JSON.parse(matchStr);
                  // Verifica se é uma lista válida que contém objetos com código/cupom
                  if (Array.isArray(parsed) && parsed.length > 0) {
                    const emItem = parsed[0];
                    if (emItem.code || emItem.codigo || emItem.coupon || emItem.desconto) {
                      cuponsEncontrados = parsed;
                      break;
                    }
                  }
                } catch(e) {}
              }

              console.log("Cupons encontrados:", cuponsEncontrados.length);
              fs.writeFileSync("data.json", JSON.stringify(cuponsEncontrados, null, 2));
            } catch (err) {
              console.error("Erro na busca:", err);
              process.exit(1);
            }
          }
          extrair();
          '

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Atualizando cupons [skip ci]" || exit 0
          git push
