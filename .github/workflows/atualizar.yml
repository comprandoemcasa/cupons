name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair Cupons sem Erro
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Buscando dados da página...");
              const response = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
              });

              const html = response.data;
              const cuponsMap = new Map();

              // Palavras/Sistemas a serem ignorados
              const ignorar = [
                "NEXT", "DATA", "BUILD", "PAGE", "PROPS", "STATIC", "RUNTIME", "CHUNK",
                "MANIFEST", "UTF8", "REACT", "HEAD", "BODY", "META", "LINK", "TRUE",
                "FALSE", "NULL", "UNDEFINED", "SPAN", "DIV", "STYLE", "SCRIPT", "CLASS",
                "HREF", "PATH", "TYPE", "SLUG", "MAIN", "INDEX", "HOME", "VIEW", "APP",
                "DESCONTO", "CUPOM", "CUPONS", "MERCADO", "LIVRE", "MAISCUPONS", "CATEGORIA"
              ];

              // Regex para encontrar potenciais códigos em maiúsculas dentro do HTML/JSON
              const regex = /"([A-Z0-9]{4,25})"/g;
              let match;

              while ((match = regex.exec(html)) !== null) {
                const code = match[1].trim();

                // Regras para ser um cupom legítimo:
                // 1. Não começa com MLB (anúncio ML)
                // 2. Não está na lista de ignorados
                // 3. Contém letras (não é só número)
                // 4. Tem tamanho mínimo de 4 caracteres
                if (
                  code.length >= 4 &&
                  !code.startsWith("MLB") &&
                  !ignorar.includes(code) &&
                  isNaN(code) &&
                  /[A-Z]/.test(code) &&
                  !cuponsMap.has(code)
                ) {
                  cuponsMap.set(code, {
                    code: code,
                    discount: "Desconto ML",
                    category: "Mercado Livre",
                    min_purchase: ""
                  });
                }
              }

              const listaFinal = Array.from(cuponsMap.values());
              console.log("Cupons reais encontrados:", listaFinal.length);

              if (listaFinal.length > 0) {
                fs.writeFileSync("data.json", JSON.stringify(listaFinal, null, 2));
              } else {
                console.log("Nenhum novo cupom encontrado, mantendo data.json anterior.");
              }

            } catch (err) {
              console.error("Erro no processo:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons atualizados com sucesso [skip ci]" || exit 0
          git push
