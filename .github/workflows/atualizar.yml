name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios cheerio

      - name: Extrair cupons oficiais
        run: |
          node -e '
          const axios = require("axios");
          const cheerio = require("cheerio");
          const fs = require("fs");

          async function extrair() {
            try {
              const res = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/");
              const $ = cheerio.load(res.data);
              const cupons = [];

              // Varre a estrutura HTML exata dos cards de cupom do site fonte
              $(".coupon-card, .card, [class*=\"coupon\"], [class*=\"card\"]").each((i, el) => {
                const texto = $(el).text();
                // Pega o código do cupom
                const codeMatch = texto.match(/([A-Z0-9]{4,20})/);
                // Pega valores de desconto (ex: 10% OFF, R$ 20 OFF)
                const descMatch = texto.match(/(R\$\s*\d+|\d+%\s*OFF)/i);

                if (codeMatch && codeMatch[0]) {
                  const code = codeMatch[0];
                  // Filtra palavras do sistema para não virar lixo
                  const ignorar = ["DOCTYPE", "HEADER", "FOOTER", "HTML", "CLASS", "STYLE"];
                  if (!ignorar.includes(code) && code.length >= 4) {
                    cupons.push({
                      code: code,
                      discount: descMatch ? descMatch[0] : "Desconto Especial",
                      category: "Mercado Livre",
                      min_purchase: ""
                    });
                  }
                }
              });

              // Remove duplicados garantindo lista limpa
              const unicos = [];
              const mapa = new Set();
              for (const item of cupons) {
                if (!mapa.has(item.code)) {
                  mapa.add(item.code);
                  unicos.push(item);
                }
              }

              console.log("Cupons extraídos:", unicos.length);
              fs.writeFileSync("data.json", JSON.stringify(unicos, null, 2));
            } catch (err) {
              console.error("Erro na extração:", err);
              process.exit(1);
            }
          }
          extrair();
          '

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons atualizados automaticamente [skip ci]" || exit 0
          git push
