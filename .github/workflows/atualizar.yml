name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install puppeteer

      - name: Extrair cupons com navegador virtual
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const fs = require("fs");

          async function rodar() {
            try {
              const browser = await puppeteer.launch({ headless: "new" });
              const page = await browser.newPage();
              await page.goto("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", { waitUntil: "networkidle2" });

              // Captura a lista de cupons processada na memória da página
              const cupons = await page.evaluate(() => {
                if (window.cuponsData) return window.cuponsData;
                
                // Fallback: extrai do DOM renderizado
                const cards = document.querySelectorAll(".coupon-card, .card");
                const lista = [];
                cards.forEach(c => {
                  const txt = c.innerText;
                  const code = txt.match(/[A-Z0-9]{4,15}/);
                  if (code) {
                    lista.push({
                      code: code[0],
                      discount: "Cupom Oficial",
                      category: "Mercado Livre"
                    });
                  }
                });
                return lista;
              });

              await browser.close();
              console.log("Cupons capturados:", cupons.length);
              fs.writeFileSync("data.json", JSON.stringify(cupons, null, 2));
            } catch (err) {
              console.error("Erro:", err);
              process.exit(1);
            }
          }
          rodar();
          '

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Cupons automáticos atualizados [skip ci]" || exit 0
          git push
