name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios

      - name: Extrair Cupons via __NEXT_DATA__
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Lendo HTML da página...");
              const response = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
              });

              const html = response.data;
              let cuponsMap = new Map();

              const nextDataMatch = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);

              if (nextDataMatch && nextDataMatch[1]) {
                const dataObj = JSON.parse(nextDataMatch[1]);

                function buscarCupons(obj) {
                  if (!obj || typeof obj !== "object") return;

                  if (obj.code || obj.codigo) {
                    const code = String(obj.code || obj.codigo).trim().toUpperCase();
                    const desc = obj.discount || obj.desconto || obj.title || "Desconto ML";
                    const cat = obj.category || obj.categoria || "Mercado Livre";
                    const min = obj.min_purchase || obj.minimo || "";

                    // Filtra palavras genéricas e IDs do Mercado Livre (MLB)
                    const palavrasInvalidas = ["DESCONTO", "CUPOM", "CUPONS", "MERCADO", "LIVRE", "MAISCUPONS"];
                    const ehMLB = code.startsWith("MLB");

                    if (code.length >= 4 && !palavrasInvalidas.includes(code) && !ehMLB) {
                      cuponsMap.set(code, {
                        code: code,
                        discount: desc,
                        category: cat,
                        min_purchase: min
                      });
                    }
                  }

                  for (let k in obj) {
                    if (typeof obj[k] === "object") {
                      buscarCupons(obj[k]);
                    }
                  }
                }

                buscarCupons(dataObj);
              }

              const listaFinal = Array.from(cuponsMap.values());
              console.log("Cupons válidos encontrados:", listaFinal.length);

              fs.writeFileSync("data.json", JSON.stringify(listaFinal, null, 2));

            } catch (err) {
              console.error("Erro na extração:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar alterações
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Filtro de IDs do ML aplicado [skip ci]" || exit 0
          git push
