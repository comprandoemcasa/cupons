name: Atualizar Cupons de Hora em Hora

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install axios cheerio

      - name: Extrair Cupons e Regras Exatas
        run: |
          node -e '
          const axios = require("axios");
          const cheerio = require("cheerio");
          const fs = require("fs");

          async function extrair() {
            try {
              console.log("Baixando HTML da fonte...");
              const { data: html } = await axios.get("https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/", {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                }
              });

              const $ = cheerio.load(html);
              const cupons = [];

              // Tenta extrair primeiro do JSON global do NextJS com regex profundo
              const match = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);
              
              if (match && match[1]) {
                try {
                  const jsonData = JSON.parse(match[1]);
                  
                  function buscarCupons(obj) {
                    if (!obj || typeof obj !== "object") return;
                    
                    if (Array.isArray(obj)) {
                      obj.forEach(item => buscarCupons(item));
                      return;
                    }

                    // Se encontrou um objeto de cupom
                    if (obj.code || obj.codigo || obj.couponCode) {
                      const code = obj.code || obj.codigo || obj.couponCode;
                      if (typeof code === "string" && code.length >= 3) {
                        
                        let desc = obj.discount || obj.desconto || obj.discountValue || "";
                        if (obj.discountType === "percentage" || obj.discountType === "%") {
                          desc = `${obj.discountValue || desc}% OFF`;
                        } else if (obj.discountType === "fixed" || obj.discountType === "currency") {
                          desc = `R$ ${obj.discountValue || desc} OFF`;
                        }

                        cupons.push({
                          code: code.trim().toUpperCase(),
                          discount: desc || "10% OFF",
                          category: obj.category || obj.categoria || "Mercado Livre",
                          min_purchase: obj.minPurchase || obj.compraMinima || obj.min_purchase || "R$ 129",
                          max_discount: obj.maxDiscount || obj.descontoMaximo || obj.max_discount || "R$ 150",
                          period: obj.period || obj.periodo || obj.expirationDate || ""
                        });
                      }
                    }

                    for (let k in obj) {
                      if (typeof obj[k] === "object") buscarCupons(obj[k]);
                    }
                  }

                  buscarCupons(jsonData);
                } catch (e) {
                  console.log("Erro ao parsear Next Data JSON:", e.message);
                }
              }

              // Se a varredura JSON não pegou regras completas, faz a varredura visual no HTML
              if (cupons.length === 0 || !cupons[0].min_purchase) {
                console.log("Executando varredura HTML por texto...");
                
                // Varre o texto bruto procurando blocos de cupons
                const cupomRegex = /([A-Z0-9_-]{4,20})\s*.*?(10%|\d+%\s*OFF|\d+\$\s*OFF).*?(R\$\s*\d+).*?(R\$\s*\d+)/gi;
                
                // Extrai via tags HTML
                $("*").each((i, el) => {
                  const text = $(el).text();
                  if (text.includes("COMPRA MÍNIMA") || text.includes("DESCONTO MÁX")) {
                    const codeMatch = text.match(/([A-Z0-9_]{4,20})/);
                    const descMatch = text.match(/(\d+%\s*OFF|\d+%\s*|R\$\s*\d+)/i);
                    const minMatch = text.match(/COMPRA MÍNIMA\s*(R\$\s*\d+|\d+)/i);
                    const maxMatch = text.match(/DESCONTO MÁX\.?\s*(R\$\s*\d+|\d+)/i);

                    if (codeMatch && codeMatch[1]) {
                      cupons.push({
                        code: codeMatch[1].toUpperCase(),
                        discount: descMatch ? descMatch[1].trim() : "10% OFF",
                        category: "OUTROS",
                        min_purchase: minMatch ? minMatch[1].trim() : "R$129",
                        max_discount: maxMatch ? maxMatch[1].trim() : "R$150",
                        period: "Expira Hoje"
                      });
                    }
                  }
                });
              }

              // Remover duplicados mantendo os mais completos
              const mapa = new Map();
              for (const c of cupons) {
                if (!mapa.has(c.code) || (c.min_purchase && mapa.get(c.code).min_purchase === "Sem Mínimo")) {
                  mapa.set(c.code, c);
                }
              }

              let finalCupons = Array.from(mapa.values());

              // Fallback para garantir que TECHEMCASA venha com a regra correta se a API estiver oculta
              finalCupons = finalCupons.map(c => {
                if (c.code === "TECHEMCASA") {
                  return {
                    code: "TECHEMCASA",
                    discount: "10% OFF",
                    category: "OUTROS",
                    min_purchase: "R$ 129",
                    max_discount: "R$ 150",
                    period: "Expira hoje"
                  };
                }
                return c;
              });

              console.log("Cupons Finais Processados:", JSON.stringify(finalCupons, null, 2));

              fs.writeFileSync("data.json", JSON.stringify(finalCupons, null, 2));

            } catch (err) {
              console.error("Erro na extração:", err.message);
              process.exit(1);
            }
          }

          extrair();
          '

      - name: Salvar alterações
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Regras completas de cupons atualizadas [skip ci]" || exit 0
          git push
